[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awghr"
version = "0.1"
description = "A(nother) Workflow Generator for High-throughput computeRing"
authors = [
    { name = "Karl Wette", email = "karl.wette@anu.edu.au" },
]
requires-python = ">=3.10"
dependencies = [
    "pint>=0.24.0",
    "tqdm>=4.66.5",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSES/MIT.txt"]

[project.scripts]
awghr = "awghr.cli:cli"

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "D100", "D101", "D102", "D103", "D104", "D106",
    "D200", "D201", "D204", "D205", "D206", "D207", "D208", "D209",
    "D210", "D211", "D212", "D214", "D215",
    "D400", "D403", "D405",
    "E4", "E7", "E9",
    "EM",
    "F",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["D"]

[tool.pydoclint]
style = "google"
allow-init-docstring = true
skip-checking-raises = true

[tool.auto-reuse.styles]
".Dockerfile" = "python"

[tool.ppqs.defaults]
print-header = true

[tool.ppqs.scripts.init]
description = "Initialise project"
script = """
python -m pip install -r requirements-dev.txt
pre-commit install
python -m pip install -e .
ppqs docker init
"""

[tool.ppqs.scripts.lint]
description = "Perform linting checks"
script = """
pre-commit run -a
"""

[tool.ppqs.scripts.build]
description = "Build project"
script = """
ppqs clean
python -m build
"""

[tool.ppqs.scripts.docker]
description = "Manage Docker containers needed for testing"
script = """
python docker/tasks.py ...
"""

[tool.ppqs.scripts.test]
description = "Run tests"
script = [
    ["ppqs", "build"],
    ["ppqs", "docker", "test"],
    ["coverage", "combine", "--rcfile=test/coverage.cfg", "--data-file=.coverage", ["test", ".coverage-*"]],
    ["coverage", "report", "--rcfile=test/coverage.cfg", "--data-file=.coverage"],
]

[tool.ppqs.scripts.clean]
description = "Clean up build files"
script = "git clean -Xdf"
