[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "awghr"
description = "A(nother) Workflow Generator for High-throughput computeRing"
authors = [
    { name = "Karl Wette", email = "karl.wette@anu.edu.au" },
]
requires-python = ">=3.11"
dependencies = [
    "pint>=0.24.0",
    "tqdm>=4.66.5",
]
readme = "README.md"
license = "MIT"
license-files = [
    'LICENSES/MIT.txt',
    'LICENSES/CC0-1.0.txt',
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Distributed Computing",
]
dynamic = ["version"]

[project.scripts]
awghr-config = "awghr._config:cli"

[tool.setuptools_scm]
scm.git.pre_parse = "fail_on_shallow"
local_scheme = "node-and-timestamp"

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "D1", "D2", "D4",
    "E4", "E7", "E9",
    "EM",
    "F",
    "I",
]
ignore = [
    "D105", "D107", "D202",
]

[tool.ruff.lint.per-file-ignores]
"doc/*.py" = ["D"]
"test/**/*.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
allow-init-docstring = false
skip-checking-raises = true

[tool.auto-reuse.styles]
".Dockerfile" = "python"

[tool.sphinx-pyproject]
project = "awghr"
language = "en"
html_theme = "alabaster"
extensions = [
    "autoapi.extension",
    "sphinx.ext.autodoc",
    "sphinx.ext.napoleon",
    "sphinx.ext.intersphinx",
]
autoapi_dirs = ["../src"]
autoapi_generate_api_docs = false
autoapi_root = "api"
autodoc_typehints = "description"

[tool.ppqs.defaults]
print-header = true

[tool.ppqs.scripts.init]
description = "Initialise project (without Docker setup)"
script = """
python -m pip install -r requirements-dev.txt
pre-commit install
python -m pip install -e .
"""

[tool.ppqs.scripts.init-docker]
description = "Initialise project (including Docker setup)"
script = """
ppqs init
ppqs docker init
"""

[tool.ppqs.scripts.lint]
description = "Perform linting checks"
script = """
pre-commit run -a
"""

[tool.ppqs.scripts.build]
description = "Build project"
script = """
ppqs clean
python -m build
"""

[tool.ppqs.scripts.doc]
description = "Build documentation"
script = """
rm -rf html/
sphinx-build --builder html doc/ html/
"""

[tool.ppqs.scripts.docker]
description = "Manage Docker containers needed for testing"
script = """
python docker/tasks.py ...
"""

[tool.ppqs.scripts.test]
description = "Run tests"
script = [
    ["ppqs", "build"],
    ["ppqs", "docker", "test"],
    ["coverage", "combine", "--rcfile=test/coverage.cfg", "--data-file=.coverage", ["test", ".coverage-*"]],
    ["coverage", "report", "--rcfile=test/coverage.cfg", "--data-file=.coverage"],
]

[tool.ppqs.scripts.version]
description = "Print the current package version"
script = "python -m setuptools_scm"

[tool.ppqs.scripts.tag]
description = "Tag and upload a release"
script = [
    ["git", "status"],
    ["git", "diff", "--quiet", "--exit-code"],
    ["ppqs", "lint"],
    ["ppqs", "build"],
    ["ppqs", "test"],
    ["git", "commit", "--allow-empty", "-m", "Version {1}.{2}.{3}"],
    ["git", "tag", "-a", "-m", "Version {1}.{2}.{3}", "v{1}.{2}.{3}"],
    ["git", "push", "origin"],
    ["git", "push", "origin", "--tags"],
]

[tool.ppqs.scripts.clean]
description = "Clean up build files"
script = "git clean -Xdf"
