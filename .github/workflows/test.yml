name: Test package

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_call: null
  workflow_dispatch: null

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Initialise project
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            python -m pip install --upgrade pip
            python -m pip install ppqs
            ppqs init
            ppqs version

      - name: Perform linting checks
        run: |
          ppqs lint

      - name: Build project
        run: |
          ppqs build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.python-version }}
          path: |
            README.md
            dist/
            test/
          retention-days: 1

      - name: Clean up build files
        run: |
          ppqs clean

  test:
    runs-on: ubuntu-latest

    needs: build

    strategy:
      fail-fast: false
      matrix:
        test:
          - batch-system: "htcondor"
            python-version: "3.14"
          - batch-system: "local"
            python-version: "3.14"
          - batch-system: "pbs"
            python-version: "3.12"
          - batch-system: "slurm"
            python-version: "3.12"

    container:
      image: docker://ghcr.io/${{ github.repository }}:test-${{ matrix.test.batch-system }}
      options: --hostname ${{ matrix.test.batch-system }}-ubuntu-host

    defaults:
      run:
        working-directory: /testing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ matrix.test.python-version }}
          path: /testing

      - name: Setup tests
        run: |
          testfiles=`echo /testing/test/test_*.py`
          echo "COLUMNS='${COLUMNS:-96}'" > /testing/test/.runnerrc
          echo "TESTFILES='${testfiles}'" >> /testing/test/.runnerrc
          echo "_GHA_PYTHON_VERSION='${{ matrix.test.python-version }}'" >> /testing/test/.runnerrc
          echo "----- /testing/test/.runnerrc"
          cat /testing/test/.runnerrc
          echo "-----"

      - name: Run tests
        run: |
          /usr/local/bin/entrypoint /bin/bash /testing/test/runner.sh ${{ matrix.test.batch-system }}

      - name: Upload coverage data file
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test.batch-system }}
          path: /testing/.coverage-${{ matrix.test.batch-system }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Initialise project
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements-dev.txt

      - name: Download coverage data files
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Check coverage
        run: |
          coverage combine --rcfile=test/coverage.cfg --data-file=.coverage .coverage-*
          coverage report --rcfile=test/coverage.cfg --data-file=.coverage

  all-done:
    runs-on: ubuntu-latest

    needs: [build, test, coverage]

    steps:
      - name: All done
        run: |
          echo All done
