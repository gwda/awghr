[DEFAULT]
account = default
cluster = testing
envlist =
    H.ME
    TESTVAR=abc
    MYCPUS = {_ncpus}

[DEFAULT SLURM]
match batch = slurm
jobfs = /tmp/slurm-${SLURM_JOB_ID}

[MAXARRAY SLURM]
match batch = slurm
match tag = maxarray
n_arraymax = 7

[DEFAULT PBS]
match batch = pbs
jobfs = /tmp/pbs-${PBS_JOBID}

[MAXARRAY PBS]
match batch = pbs
match tag = maxarray
n_arraymax = 5

[DEFAULT HTCONDOR]
match batch = htcondor
submit_opt_list =
    CONDOR_TEST_OPT=val
file_transfer_scheme_list =
    /tmp/abcd/staging=abcd
