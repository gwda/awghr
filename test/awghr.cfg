[DEFAULT]
account = default

[DEFAULT SLURM]
match batch = slurm
jobfs = /tmp/slurm-scratch/${SLURM_JOB_ID}

[MAXARRAY SLURM]
match batch = slurm
match tag = maxarray
n_arraymax = 7

[DEFAULT PBS]
match batch = pbs
jobfs = /tmp/pbs-scratch/${PBS_JOBID}

[MAXARRAY PBS]
match batch = pbs
match tag = maxarray
n_arraymax = 5
