[DEFAULT]
account = default
envlist =
    H.ME
    TESTVAR=abc
    MYTHREADS={_threads}

[DEFAULT SLURM]
match batch = slurm
jobfs = /tmp/slurm-${SLURM_JOB_ID}

[MAXARRAY SLURM]
match batch = slurm
match tag = maxarray
n_arraymax = 7

[DEFAULT PBS]
match batch = pbs
jobfs = /tmp/pbs-${PBS_JOBID}

[MAXARRAY PBS]
match batch = pbs
match tag = maxarray
n_arraymax = 5
